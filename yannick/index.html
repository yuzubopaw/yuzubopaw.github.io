<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="theme-color" content="#fff6ec">
  <title>Yannick's Skill Play</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@500;600;700&family=Noto+Sans+TC:wght@500;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/app.css">
  <link rel="icon" id="favicon" href="assets/star.jpg">
</head>
<body>
  <div class="app">
    <header class="topbar">
      <div id="back-slot"></div>
      <div class="brand">
        <img class="logo" id="logo" src="assets/illust/logo.png" alt="">
        <div>
          <h1 id="brand-title">Yannick's Skill Play</h1>
          <div class="sub" id="brand-sub">Practice games</div>
        </div>
      </div>
      <div class="top-actions">
        <span class="star-chip" id="star-chip">⭐ 0</span>
        <button class="icon-btn" id="sound-btn" aria-label="Sound">🔊</button>
        <button class="lang-btn" id="lang-btn">中文</button>
      </div>
    </header>
    <main id="stage"></main>
  </div>
  <script src="js/assets-data-1.js"></script>
  <script src="js/assets-data-2.js"></script>
  <script src="js/assets-data-3.js"></script>
  <script>
    (function () {
      function a(p) { return (window.ASSET && ASSET[p]) || p; }
      var f = document.getElementById("favicon");
      var l = document.getElementById("logo");
      if (f) f.href = a("assets/star.jpg");
      if (l) l.src = a("assets/illust/logo.png");
    })();
  </script>
  <script src="js/engine.js"></script>
  <script src="js/games.js"></script>
  <script src="js/app.js"></script>
</body>
</html>
